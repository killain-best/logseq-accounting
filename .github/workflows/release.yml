name: Check and Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run check

      - name: Package plugin
        if: startsWith(github.ref, 'refs/tags/v')
        run: zip -r "logseq-accounting-${GITHUB_REF_NAME}.zip" dist package.json icon.svg README.md LICENSE

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: logseq-accounting-${{ github.ref_name }}.zip
          generate_release_notes: true
